[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-market-analysis"
version = "0.1.0"
description = "Deterministic analytical feature layer for the BBB Market YEE-29 work order"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk==0.7.1"]

[project.scripts]
yee47-external-research = "market_analysis.external_research_cli:main"
yee54-opportunity-synthesis = "market_analysis.opportunity_synthesis_cli:main"
yee55-commercial-validation = "market_analysis.commercial_validation_cli:main"
yee57-concept-synthesis = "market_analysis.concept_synthesis_cli:main"
yee59-decision-matrix = "market_analysis.decision_matrix_cli:main"
yee60-plugin-universe = "market_analysis.plugin_eligibility_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


